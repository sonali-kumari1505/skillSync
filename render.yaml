services:
  # Node.js + Express API Backend Server
  - type: web
    name: skillsync-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: skillsync-ai-engine
          property: host

  # Python FastAPI AI Recommendation Engine
  - type: web
    name: skillsync-ai-engine
    env: python
    plan: free
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
